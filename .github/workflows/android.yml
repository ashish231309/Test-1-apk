name: Android foundation

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Verify architecture and negative fixtures
        run: |
          python3 tools/verify_nivara.py
          python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Run JVM tests and build debug, Android-test, and release APKs; lint
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug assembleAndroidTest assembleRelease lint --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          result=$?
          if (( result != 0 )); then
            tail -n 40 "$RUNNER_TEMP/gradle.log" >&2
            python3 - <<'PY' > "$RUNNER_TEMP/test-failures.txt"
          import pathlib
          import xml.etree.ElementTree as ET

          for report in pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              root = ET.parse(report).getroot()
              for test in root.iter('testcase'):
                  for failure in list(test.findall('failure')) + list(test.findall('error')):
                      print(f"{test.get('classname')}#{test.get('name')}: {failure.get('message', '')}")
                      failure_lines = (failure.text or '').splitlines()
                      for line in failure_lines[:25]:
                          print(line)
                      if len(failure_lines) > 25:
                          print('... remaining stack omitted ...')
                          for line in failure_lines[-8:]:
                              print(line)
          PY
            if [[ -s "$RUNNER_TEMP/test-failures.txt" ]]; then
              while IFS= read -r line; do
                diagnostic="$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')"
                echo "::error title=JVM test diagnostics::$diagnostic"
              done < "$RUNNER_TEMP/test-failures.txt"
            else
              grep -E '(^e: |^FAILURE:|^\* What went wrong:|^Execution failed for task|^> Task .*FAILED|^Caused by:|AssertionError|expected:<|but was:<|There were failing tests|Compilation error|error: )' "$RUNNER_TEMP/gradle.log" | tail -n 40 | while IFS= read -r line; do
                diagnostic="$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')"
                echo "::error title=Gradle diagnostics::$diagnostic"
              done
            fi
          fi
          exit "$result"
      - name: Summarize JVM test count
        if: success() || failure()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pathlib
          import xml.etree.ElementTree as ET

          files = list(pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          if not files:
              print('- JVM test reports unavailable (the test task may not have started).')
              raise SystemExit(0)
          totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for report in files:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, '0'))
          print('## JVM test results')
          print(f"- Test cases: {totals['tests']}")
          print(f"- Failures: {totals['failures']}; errors: {totals['errors']}; skipped: {totals['skipped']}")
          PY
      - name: Inspect release APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")"
          printf '%s\n' "$badging" | grep -F "package: name='com.ashishkumar.nivara' versionCode='1' versionName='0.1.0'"
          size="$(stat -c '%s' "$apk")"
          checksum="$(sha256sum "$apk" | cut -d ' ' -f1)"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-signing.txt" 2>&1; then
            signing='signed'
          else
            cat "$RUNNER_TEMP/apk-signing.txt"
            if grep -Eiq '^ERROR: APK is not signed\.?$|^ERROR: No signers found\.?$|^ERROR: JAR_SIG_NO_SIGNATURES: No JAR signatures$|^ERROR: No JAR signatures$' "$RUNNER_TEMP/apk-signing.txt"; then
              signing='unsigned (no release signing configuration is committed)'
            else
              echo 'APK signing verification failed for a reason other than the expected unsigned release configuration.' >&2
              exit 1
            fi
          fi
          {
            echo "## Release APK inspection"
            echo "- Path: $apk"
            echo "- Filename: $(basename "$apk")"
            echo "- Variant: release"
            echo "- Application ID: com.ashishkumar.nivara"
            echo "- Version: 0.1.0 (1)"
            echo "- Size: $size bytes"
            echo "- SHA-256: $checksum"
            echo "- Signing: $signing"
          } | tee release-apk-audit.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: nivara-release-apk-${{ github.run_id }}
          path: |
            app/build/outputs/apk/release/*.apk
            release-apk-audit.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports-${{ github.run_id }}
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 3
